<script>
(function(){
var img=document.getElementById('f'),c=document.getElementById('g');
var gl=c.getContext('webgl');
function start(){
 if(!gl){return;}
 var vs='attribute vec2 a;varying vec2 v;void main(){v=vec2(a.x*.5+.5,.5-a.y*.5);gl_Position=vec4(a,0.,1.);}';
 var fs='precision highp float;uniform sampler2D u;uniform float t;varying vec2 v;'+
 'float B(vec2 p,vec2 c,vec2 r){vec2 d=(p-c)/r;return exp(-dot(d,d));}'+
 'void main(){vec2 p=v,o=vec2(0.);'+
 'float sky=smoothstep(.75,.35,p.y);'+
 'o.x+=(sin(p.y*9.+t*.35+p.x*4.)*.0035+sin(t*.15)*.004)*sky;'+
 'o.y+=cos(p.x*7.+t*.3)*.0025*sky;'+
 'float fl=smoothstep(.76,1.,p.y);'+
 'o.x+=sin(p.x*18.+t*1.5+p.y*12.)*.0045*fl;'+
 'o.y+=sin(p.x*14.-t*1.2)*.002*fl;'+
 'float k=B(p,vec2(.197,.457),vec2(.07,.065));'+
 'o+=vec2(sin(t*1.1),cos(t*1.5))*.007*k;'+
 'float b=B(p,vec2(.694,.579),vec2(.035,.07));'+
 'o+=vec2(sin(t*1.1)*.003,sin(t*1.6)*.007)*b;'+
 'float m=0.;'+
 'vec2 K[8];K[0]=vec2(.21,.7);K[1]=vec2(.326,.7);K[2]=vec2(.422,.7);K[3]=vec2(.506,.71);K[4]=vec2(.568,.73);K[5]=vec2(.727,.71);K[6]=vec2(.799,.71);K[7]=vec2(.9,.76);'+
 'for(int i=0;i<8;i++){vec2 d=(p-K[i])/vec2(.034,.085);m=max(m,exp(-dot(d,d)*1.5));}'+
 'o*=1.-clamp(m*1.3,0.,1.);'+
 'vec4 col=texture2D(u,p+o);'+
 'col.rgb+=.05*sky*(sin(p.x*5.-t*.4+p.y*3.)*.5+.5)*vec3(1.,.95,.85);'+
 'col.rgb+=.07*fl*pow(sin(p.x*60.+t*2.)*sin(p.y*50.-t*1.7)*.5+.5,8.);'+
 'gl_FragColor=col;}';
 function sh(t,s){var h=gl.createShader(t);gl.shaderSource(h,s);gl.compileShader(h);return h;}
 var pr=gl.createProgram();
 gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
 gl.linkProgram(pr);gl.useProgram(pr);
 var bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);
 gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
 var al=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
 var tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);
 gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
 var ut=gl.getUniformLocation(pr,'t');
 // petals
 var pc=document.getElementById('p'),x=pc.getContext('2d'),cols=['#ffd6e7','#fff3b0','#ffffff','#ffc9a8'];
 var ps=[];for(var i=0;i<45;i++)ps.push({x:Math.random()*1671,y:300+Math.random()*640,s:3+Math.random()*4,v:20+Math.random()*40,ph:Math.random()*6.28,c:cols[i%4],r:Math.random()*6});
 var t0=performance.now(),last=t0;
 function f(n){
  var t=(n-t0)/1000,dt=Math.min(.05,(n-last)/1000);last=n;
  gl.viewport(0,0,c.width,c.height);gl.uniform1f(ut,t);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  x.clearRect(0,0,1671,941);
  ps.forEach(function(q){
   q.x+=q.v*dt;q.y+=Math.sin(t*1.2+q.ph)*14*dt-4*dt;
   if(q.x>1700){q.x=-10;q.y=300+Math.random()*640;}
   x.save();x.translate(q.x,q.y);x.rotate(q.r+t*1.5);x.globalAlpha=.8;x.fillStyle=q.c;
   x.beginPath();x.ellipse(0,0,q.s,q.s*.5,0,0,6.283);x.fill();x.restore();
  });
  requestAnimationFrame(f);
 }
 img.style.visibility='hidden';
 requestAnimationFrame(f);
}
if(img.complete)start();else img.onload=start;
})();
