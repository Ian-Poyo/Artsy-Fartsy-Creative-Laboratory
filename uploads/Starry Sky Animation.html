(function(){
var W=1672,H=941,cv=document.getElementById('c'),ctx=cv.getContext('2d');
var vw,vh,s,ox,oy,dpr;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);vw=innerWidth;vh=innerHeight;cv.width=vw*dpr;cv.height=vh*dpr;
 s=Math.max(vw/W,vh/H);ox=(vw-W*s)/2;oy=(vh-H*s)/2;ctx.setTransform(dpr,0,0,dpr,0,0);}
addEventListener('resize',resize);resize();

// sprites
function mk(n,f){var c=document.createElement('canvas');c.width=c.height=n;f(c.getContext('2d'),n);return c;}
var glow=mk(64,function(g,n){var r=g.createRadialGradient(n/2,n/2,0,n/2,n/2,n/2);
 r.addColorStop(0,'rgba(255,248,220,1)');r.addColorStop(.25,'rgba(255,220,130,.55)');r.addColorStop(1,'rgba(255,200,90,0)');g.fillStyle=r;g.fillRect(0,0,n,n);});
var spark=mk(128,function(g,n){var h=n/2;
 g.drawImage(glow,h-32,h-32);
 [[1,.16],[.16,1]].forEach(function(a){g.save();g.translate(h,h);g.scale(a[0],a[1]);
  var r=g.createRadialGradient(0,0,0,0,0,h);r.addColorStop(0,'rgba(255,255,240,1)');r.addColorStop(.3,'rgba(255,236,170,.6)');r.addColorStop(1,'rgba(255,220,130,0)');
  g.fillStyle=r;g.beginPath();g.arc(0,0,h,0,7);g.fill();g.restore();});});

// big sparkle stars (image coordinates)
var P=[[759,20,1],[640,56,.9],[747,73,.8],[471,110,.7],[328,157,.9],[1171,17,.7],[852,44,.5],[220,98,.5],[806,296,1],[1147,378,.9],[360,385,.8],[764,390,.8],[1052,413,.6],[1010,355,.4],[503,158,.5],[594,307,.4],[1090,120,.5],[960,200,.5],[130,230,.4],[1380,150,.5],[1500,300,.4],[300,60,.4],[1250,260,.5],[560,420,.5]];
var stars=P.map(function(p,i){return{x:p[0],y:p[1],z:p[2],ph:Math.random()*6.28,sp:.8+Math.random()*1.8,rot:(Math.random()-.5)*.5}});

// ambient twinkling dust
var dust=[];for(var i=0;i<150;i++)dust.push({x:Math.random()*W,y:Math.random()*520,z:.08+Math.random()*.16,ph:Math.random()*6.28,sp:1+Math.random()*3,vx:(Math.random()-.5)*4,vy:-Math.random()*3});

// stream of sparks rising from the head into the sky
var N=110,st=[];function reset(p,init){p.t=init?Math.random():0;p.d=7+Math.random()*9;p.x0=830+Math.random()*130;p.y0=560+Math.random()*50;
 p.tx=p.x0+(Math.random()-.5)*900;p.ty=60+Math.random()*320;p.w=Math.random()*6.28;p.wa=10+Math.random()*30;p.z=.12+Math.random()*.22;}
for(i=0;i<N;i++){var q={};reset(q,true);st.push(q);}

var shoot=null,nextShoot=3;
function draw(img,x,y,sz,a,rot){ctx.globalAlpha=a;
 if(rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.drawImage(img,-sz/2,-sz/2,sz,sz);ctx.restore();}
 else ctx.drawImage(img,x-sz/2,y-sz/2,sz,sz);}

 ctx.clearRect(0,0,vw,vh);ctx.globalCompositeOperation='lighter';

 // dust
 for(var i=0;i<dust.length;i++){var d=dust[i];d.x+=d.vx*dt;d.y+=d.vy*dt;
  if(d.y<-10)d.y=520;if(d.x<-10)d.x=W;if(d.x>W+10)d.x=-10;
  var a=.5+.5*Math.sin(T*d.sp+d.ph);a*=a;
  draw(glow,ox+d.x*s,oy+d.y*s,(10+d.z*60)*s,.15+a*.7,0);}

 // stream
 for(i=0;i<N;i++){var p=st[i];p.t+=dt/p.d;if(p.t>=1){reset(p,false);}
  var u=p.t,e=u*u*(3-2*u),
  x=p.x0+(p.tx-p.x0)*e+Math.sin(T*.9+p.w)*p.wa*Math.sin(u*3.14),
  y=p.y0+(p.ty-p.y0)*e;
  var al=Math.sin(u*3.14159);al*=.55+.45*Math.sin(T*3+p.w);
  draw(glow,ox+x*s,oy+y*s,(14+p.z*70)*s*(1-u*.4),al*.9,0);}

 // sparkle stars
 for(i=0;i<stars.length;i++){var t=stars[i],k=.5+.5*Math.sin(T*t.sp+t.ph);
  var sz=(34+70*t.z)*s*(.55+.7*k);
  draw(spark,ox+t.x*s,oy+t.y*s,sz,.35+.65*k,t.rot+Math.sin(T*.4+t.ph)*.15);}

 // shooting star
 if(!shoot&&T>nextShoot){shoot={t:0,x:200+Math.random()*1000,y:20+Math.random()*120,a:.35+Math.random()*.3};}
 if(shoot){shoot.t+=dt/1.1;var u2=shoot.t;
  if(u2>=1){shoot=null;nextShoot=T+5+Math.random()*7;}
  else{var L=260,dx=Math.cos(shoot.a),dy=Math.sin(shoot.a),hx=shoot.x+dx*L*u2*2.2,hy=shoot.y+dy*L*u2*2.2,
   fade=Math.sin(u2*3.14159);
   for(var j=0;j<14;j++){var f=j/14;draw(glow,ox+(hx-dx*L*f*.5)*s,oy+(hy-dy*L*f*.5)*s,(34-f*26)*s,fade*(1-f)*.8,0);}}}

 ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}
requestAnimationFrame(frame);
document.addEventListener('visibilitychange',function(){if(document.hidden)run=false;else if(!run){run=true;last=performance.now();requestAnimationFrame(frame);}});
if(matchMedia('(prefers-reduced-motion:reduce)').matches){N=30;}
})();
</script></body></html>
