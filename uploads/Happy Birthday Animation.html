<script>
(function(){
var W=1672,H=941,cv=document.getElementById('c'),ctx=cv.getContext('2d');
var vw,vh,s,ox,oy,dpr;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);vw=innerWidth;vh=innerHeight;cv.width=vw*dpr;cv.height=vh*dpr;
 s=Math.max(vw/W,vh/H);ox=(vw-W*s)/2;oy=(vh-H*s)/2;ctx.setTransform(dpr,0,0,dpr,0,0);}
addEventListener('resize',resize);resize();

// sprites
function mk(n,f){var c=document.createElement('canvas');c.width=c.height=n;f(c.getContext('2d'),n);return c;}
var glow=mk(64,function(g,n){var r=g.createRadialGradient(n/2,n/2,0,n/2,n/2,n/2);
 r.addColorStop(0,'rgba(255,248,220,1)');r.addColorStop(.25,'rgba(255,220,130,.55)');r.addColorStop(1,'rgba(255,200,90,0)');g.fillStyle=r;g.fillRect(0,0,n,n);});
var spark=mk(128,function(g,n){var h=n/2;
 g.drawImage(glow,h-32,h-32);
 [[1,.16],[.16,1]].forEach(function(a){g.save();g.translate(h,h);g.scale(a[0],a[1]);
  var r=g.createRadialGradient(0,0,0,0,0,h);r.addColorStop(0,'rgba(255,255,240,1)');r.addColorStop(.3,'rgba(255,236,170,.6)');r.addColorStop(1,'rgba(255,220,130,0)');
  g.fillStyle=r;g.beginPath();g.arc(0,0,h,0,7);g.fill();g.restore();});});


var big=mk(256,function(g,n){var r=g.createRadialGradient(n/2,n/2,0,n/2,n/2,n/2);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.5,'rgba(255,255,255,.4)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,n,n);});
function R(a,b){return a+Math.random()*(b-a);}
// sparkles (image coords)
var SP=[[865,368,.7],[1500,618,1],[350,745,.5],[700,245,.5],[960,225,.5],[640,640,.6],[300,450,.6],[1350,420,.6],[560,100,.5],[1000,120,.5],[1580,520,.5],[150,600,.4],[1230,800,.4]];
var stars=SP.map(function(p){return{x:p[0],y:p[1],z:p[2],ph:R(0,6.28),sp:R(.5,1.2),rot:R(-.3,.3)}});
// drifting motes
var motes=[];for(var i=0;i<110;i++)motes.push({x:R(0,W),y:R(0,H),z:R(.1,.3),ph:R(0,6.28),sp:R(.5,1.6),vx:R(4,14),vy:R(-9,-2)});
// soft cloud wisps
var wisps=[];for(i=0;i<9;i++)wisps.push({x:R(-200,W),y:R(80,880),r:R(180,340),v:R(5,14),a:R(.05,.1),ph:R(0,6.28)});
// stream from head to the floating island
var N=170,st=[];function reset(p,init){p.t=init?Math.random():0;p.d=R(6,12);p.x0=R(810,900);p.y0=R(650,690);p.ex=R(300,1350);p.ey=R(300,520);
 p.cx=p.x0+(p.ex-p.x0)*.25+R(-80,80);p.cy=(p.y0+p.ey)/2+R(30,110);p.w=R(0,6.28);p.wa=R(6,22);p.z=R(.1,.3);}
for(i=0;i<N;i++){var q={};reset(q,true);st.push(q);}
// falling petals / leaves
var pet=[];function rp(p,init){p.x=R(450,1250);p.y=init?R(250,900):R(260,420);p.vx=R(6,22);p.vy=R(10,28);p.r=R(0,6.28);p.vr=R(-1,1);p.s=R(3,6);p.ph=R(0,6.28);
 p.c=['rgba(255,120,110,','rgba(255,215,90,','rgba(120,190,255,','rgba(255,255,240,','rgba(255,170,90,'][(Math.random()*5)|0];}
for(i=0;i<45;i++){var pp={};rp(pp,true);pet.push(pp);}
function draw(img,x,y,sz,a,rot){ctx.globalAlpha=a;
 if(rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.drawImage(img,-sz/2,-sz/2,sz,sz);ctx.restore();}
 else ctx.drawImage(img,x-sz/2,y-sz/2,sz,sz);}
var last=performance.now(),T=0,run=true;
function frame(now){if(!run)return;requestAnimationFrame(frame);
 var dt=Math.min((now-last)/1000,.05);last=now;T+=dt;
 ctx.clearRect(0,0,vw,vh);ctx.globalCompositeOperation='lighter';
 // sun glow pulse
 draw(big,ox+900*s,oy+0,1500*s,.1+.05*Math.sin(T*.5),0);
 // wisps
 for(var i=0;i<wisps.length;i++){var w=wisps[i];w.x+=w.v*dt;if(w.x>W+w.r)w.x=-w.r;
  draw(big,ox+w.x*s,oy+w.y*s,w.r*2*s,w.a*(.7+.3*Math.sin(T*.3+w.ph)),0);}
 // motes
 for(i=0;i<motes.length;i++){var m=motes[i];m.x+=m.vx*dt;m.y+=m.vy*dt;
  if(m.x>W+10)m.x=-10;if(m.y<-10){m.y=H+10;}
  var a=.5+.5*Math.sin(T*m.sp+m.ph);draw(glow,ox+m.x*s,oy+m.y*s,(10+m.z*50)*s,.12+a*.35,0);}
 // stream
 for(i=0;i<N;i++){var p=st[i];p.t+=dt/p.d;if(p.t>=1)reset(p,false);
  var u=p.t,e=u*u*(3-2*u),v=1-e,
  x=v*v*p.x0+2*v*e*p.cx+e*e*p.ex+Math.sin(T*.9+p.w)*p.wa*Math.sin(u*3.14),
  y=v*v*p.y0+2*v*e*p.cy+e*e*p.ey;
  var al=Math.sin(u*3.14159)*(.6+.4*Math.sin(T*3+p.w));
  draw(glow,ox+x*s,oy+y*s,(14+p.z*70)*s*(1-u*.35),al*.8,0);}
 // sparkles
 for(i=0;i<stars.length;i++){var t=stars[i],k=.5+.5*Math.sin(T*t.sp+t.ph);
  draw(spark,ox+t.x*s,oy+t.y*s,(34+60*t.z)*s*(.75+.35*k),.4+.5*k,t.rot+Math.sin(T*.4+t.ph)*.08);}
 // petals
 ctx.globalCompositeOperation='source-over';
 for(i=0;i<pet.length;i++){var q=pet[i];q.x+=(q.vx+Math.sin(T+q.ph)*10)*dt;q.y+=q.vy*dt;q.r+=q.vr*dt;
  if(q.y>H+10||q.x>W+10)rp(q,false);
  var f=Math.min(1,(q.y-240)/60);ctx.globalAlpha=Math.max(0,f)*.8;ctx.fillStyle=q.c+'1)';
  ctx.beginPath();ctx.ellipse(ox+q.x*s,oy+q.y*s,q.s*s,q.s*.5*s,q.r,0,6.283);ctx.fill();}
