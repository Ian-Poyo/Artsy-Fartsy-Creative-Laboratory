<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animated graph</title>
<style>
:root{--bg:#f4f1ea;--fg:#1c2430}
@media (prefers-color-scheme:dark){:root{--bg:#14181f;--fg:#e8ecf2}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
#wrap{display:flex;flex-direction:column;align-items:center;padding:12px;gap:10px}
#box{width:100%;max-width:1670px;position:relative;overflow:hidden;border-radius:10px}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#stage img{display:block}
#screen{position:absolute;left:0;top:0;width:380px;height:230px;transform-origin:0 0;background:#f7f4ec;overflow:hidden}
button{font:inherit;padding:8px 18px;border-radius:20px;border:1px solid #3d93e0;background:transparent;color:inherit;cursor:pointer}
.bar{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0)}
.go .bar{animation:grow .8s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.15s + .3s)}
@keyframes grow{to{transform:scaleY(1)}}
.line{stroke-dasharray:1;stroke-dashoffset:1}
.go .line{animation:draw 1.4s ease-out 1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pop{opacity:0}.go .pop{animation:fade .5s ease-out 2.3s forwards}
@keyframes fade{to{opacity:1}}
.leg{opacity:0}.go .leg{animation:fade .5s ease-out forwards;animation-delay:calc(var(--i)*.2s + .4s)}
.seg{stroke-dasharray:0 100}
.go .seg{animation:pie 1.2s ease-out forwards;animation-delay:2s}
@keyframes pie{to{stroke-dasharray:var(--len) 100}}
.ttl{opacity:0}.go .ttl{animation:fade .8s ease-out forwards}

const W=1670,H=942,k=W/1670;
const Q=[[800,191],[1178,156],[1172,380],[802,389]].map(([x,y])=>[x*k,y*k]);
function solve(A,b){const n=8;for(let i=0;i<n;i++){let m=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[m][i]))m=r;[A[i],A[m]]=[A[m],A[i]];[b[i],b[m]]=[b[m],b[i]];for(let r=0;r<n;r++){if(r==i)continue;const f=A[r][i]/A[i][i];for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];b[r]-=f*b[i]}}return b.map((v,i)=>v/A[i][i])}
function homog(w,h,q){const s=[[0,0],[w,0],[w,h],[0,h]],A=[],b=[];for(let i=0;i<4;i++){const[x,y]=s[i],[u,v]=q[i];A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v)}const[a,bb,c,d,e,f,g,hh]=solve(A,b);return `matrix3d(${a},${d},0,${g},${bb},${e},0,${hh},0,0,1,0,${c},${f},0,1)`}
document.getElementById('screen').style.transform=homog(380,230,Q);
const box=document.getElementById('box'),st=document.getElementById('stage'),im=document.getElementById('im');
function fit(){const s=box.clientWidth/W;im.width=W;im.height=H;st.style.transform=`scale(${s})`;box.style.height=H*s+'px'}
addEventListener('resize',fit);fit();
